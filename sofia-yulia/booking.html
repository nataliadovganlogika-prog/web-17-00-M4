<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Grenze+Gotisch:wght@100..900&display=swap" rel="stylesheet">
    <title>Monobank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar bookbar">
        <div class="logo">Monobank</div>

        <nav class="nav-menu" id="navMenu">
            <a href="index.html" class="active">Головна</a>
            <a href="#">Кешбек</a>
            <a href="#">Вхід</a>
            <a href="booking.html">Кредит</a>
        </nav>
    </header>
    <section class="parallax booking-section">
        <div class="booking-form-container">
            <h2>Взяти кредит</h2>
            <p class="form-description">Вкажіть зручний час дзвінку та менеджер вам зателефонує для деталей оформлення</p>
            <form action="#" method="POST" id="bookingForm">
                <div class="form-group">
                    <label for="name">Ваше повне ім'я</label>
                    <input type="text" id="name" name="name" required placeholder="Галина Галімівна">
                </div>
                
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="date">Дата</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group form-group-half">
                        <label for="time">Бажаний час</label>
                        <input type="time" id="time" name="time" min="09:00" max="22:00" required>
                    </div>
                </div>

                <button type="button" class="btn btn-full" aria-required="false">Надіслати форму</button>
            </form>
        </div>
    </section>
    
    <footer>
        <p>© 2026 monobank</p>
    </footer>
</body>
</html>
