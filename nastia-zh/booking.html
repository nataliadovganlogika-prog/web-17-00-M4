        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Передзамовлення | Kitti Gyaru</title>
            <link rel="stylesheet" href="style.css">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Knewave&display=swap" rel="stylesheet">
        </head>
        <body>

            <header class="navbar">
                <div class="logo">Kitti Gyaru</div>

                <nav class="nav-menu" id="navMenu">
                    <a href="index.html">Головна</a>
                    <a href="#">Каталог</a>
                    <a href="#">Галерея</a>
                    <a href="booking.html" class="active">Бронювання</a>
                </nav>
            </header>
            <section class="form booking-section">
                <div class="booking-form-container">
                    <h2>Оформити передзамовлення</h2>
                    <p class="form-description">Оформіть передзамовлення та отримайте свою іграшку зовсім скоро</p>
                    <form action="#" method="Post" id="bookingForm">
                        <div class="form-group">
                            <label for="name">Ваше повне ім'я</label>
                            <input type="text" id="name" name="name" required placeholder="kitti">
                        </div>

                        <div class="form-row">
                            <div class="form-group form-group-half">
                                <label for="text">Номер картки</label>
                                <input type="text" id="text" name="text" required placeholder="000 000 000 000">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group form-group-half">
                                <label for="text">Номер телефону</label>
                                <input type="text" id="text" name="text" required placeholder="+*** ** *** ****">
                            </div>
                        </div>

                        <div type="button" class="btn btn-full" aria-required="false">Підтвердити передзамовлення</div>
                    </form>

                </div>
            </section>

            <footer>
                <p>2026 kitti gyaru.</p>
            </footer>
        </body>
        </html>
