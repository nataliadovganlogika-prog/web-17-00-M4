<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Англійська мова</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Англійська мова</div>

        <nav class="nav-menu" id="navMenu">
            <a href="index.html" class="active">Головна</a>
            <a href="#">Курси</a>
            <a href="#">Найкращі учні</a>
            <a href="booking.html">Записатись</a>
        </nav>
    </header>
    <section class="parallax booking-section">
        <div class="booking-form-container">
            <h2>Записатись</h2>
            <p class="form-description">Навчися англійської без проблем</p>
            <form action="#" method="POST" id="bookingForm">
                <div class="form-group">
                    <label for="name">Ваше повне ім'я</label>
                    <input type="text" id="name" name="name" required placeholder="Ім'я">
                </div>
                
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="date">Записатись</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group form-group-half">
                        <label for="time">Бажаний час</label>
                        <input type="time" id="time" name="time" min="09:00" max="22:00" required>
                    </div>
                </div>

                <button type="button" class="btn btn-full" aria-required="false">Підтвердити</button>
            </form>
        </div>
    </section>
    
    <footer>
        <p>2026 English</p>
    </footer>
</body>
</html>
