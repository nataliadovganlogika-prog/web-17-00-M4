 <!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Самокати</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
 <header class="navbar">
     <div class="logo">Електросамокат</div>
     
     <nav class="nav-menu" id="navMenu">
         <a href="index.html" class="active">Головна</a>
         <a href="#">Каталог</a>
         <a href="#">Галерея</a>
         <a href="booking.html">Замовити</a>
     </nav>
 </header>
 
 <section class="parallax booking-section">
      <div class="booking-form-container">
          <h2>Купити самокат</h2>
         <p class="form-description">Залиште свої дані та менеджер із вами зв’яжеться</p>
        <form action='#' method="POST" id="bookingForm">
        <div class="form-group">
            <ladel for="name">Ваше повне ім'я</ladel>
            <input type="text" id="name" name="name" required placeholder="Масник Олександр">
        </div>
      <div class="form-row">
          <div class="form-group form-group-half">
              <ladel for="date">Дата дзвінку</ladel>
              <input type="date" id="name" name="date" required>
          </div>
      <div class="form-group form-group-half"
      <ladel for="time">Бажаний час</ladel>
      <input type="time" id="time" name="time" min="09:00" max="22:00" required>
      </div>
     </div>
     
     <button type="button" id="time" class="btn btn-full" aria-required="false">Замовити</button>
        </form>
        </div>
 </section>
 
 <footer>
     <p>2026 Електросамокат</p>
 </footer>  
 </body>
</html>
