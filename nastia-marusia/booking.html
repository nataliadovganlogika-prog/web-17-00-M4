<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бронювання | PYSIN Coffee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header class="navbar navbooking">
        <div class="logo">PYSIN</div>

        <nav class="nav-menu" id="navMenu">
            <a href="index.html">Головна</a>
            <a href="#">Меню</a>
            <a href="#">Галерея</a>
            <a href="booking.html" class="active">Бронювання</a>
        </nav>

    </header>
    <section class="parallax2 booking-section">
        <div class="booking-form-container">
            <h2>Забронювати столик</h2>
            <p class="form-description">Зарезервуйте ідеальний час у нашій затишній кав'ярні пушін</p>
            <form action="#" method="POST" id="bookingForm">
                <div class="form-group">
                    <label for="name">Ваше повне ім'я</label>
<input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group form-group-half">
                        <label for="date">Дата бронювання</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group form-group-half">
                        <label for="time">Бажаний час</label>
<input type="time" id="time" name="time" min="09:00" max="22:00" required>
                    </div>
                </div>

<button type="button" class="btn btn-full" aria-required="false">Підтвердити бронювання</button>
            </form>
        </div>
    </section>
    
    <footer class="footer-booking">
        <p>© 2026 PYSIN Coffee.</p>
    </footer>
</body>
</html>
